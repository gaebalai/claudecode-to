<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}} — 테마 비교 & 코드 복사</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=DM+Serif+Display&family=IBM+Plex+Sans:wght@400;500;700&family=Poppins:wght@400;500;700&family=Manrope:wght@400;600;800&family=Outfit:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* lab chrome (고정) */
        --lab-bg: #0b0d10;
        --lab-panel: #14171c;
        --lab-panel-2: #1c2026;
        --lab-border: #262b33;
        --lab-text: #e6e8eb;
        --lab-text-dim: #8a93a0;
        --lab-accent: #6ee7b7;

        /* theme tokens (동적) */
        --bg: #0f1115;
        --surface: #171a21;
        --surface-2: #1f232b;
        --border: #2a2f3a;
        --text: #e6e8eb;
        --text-dim: #99a0ad;
        --primary: #6ee7b7;
        --primary-contrast: #0b0d10;
        --secondary: #818cf8;
        --danger: #f87171;
        --success: #34d399;
        --warning: #fbbf24;
        --radius: 12px;
        --radius-sm: 8px;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        --font-heading: "Plus Jakarta Sans", sans-serif;
        --font-body: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
        --button-style: solid; /* solid | glass | outline | neon | brutal | flat */
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          var(--lab-text),
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: var(--lab-bg);
        color: var(--lab-text);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      /* ====== Layout ====== */
      .app {
        display: grid;
        grid-template-columns: 320px 1fr 380px;
        height: 100vh;
        overflow: hidden;
      }

      /* ====== Sidebar ====== */
      .sidebar {
        background: var(--lab-panel);
        border-right: 1px solid var(--lab-border);
        overflow-y: auto;
        padding: 20px 18px;
      }
      .sidebar h1 {
        font-size: 16px;
        font-weight: 800;
        margin: 0 0 4px;
        letter-spacing: -0.01em;
      }
      .sidebar .sub {
        font-size: 12px;
        color: var(--lab-text-dim);
        margin-bottom: 22px;
      }
      .section {
        margin-bottom: 22px;
      }
      .section-title {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--lab-text-dim);
        margin: 0 0 10px;
      }

      /* preset cards */
      .preset-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .preset {
        background: var(--lab-panel-2);
        border: 1px solid var(--lab-border);
        border-radius: 10px;
        padding: 10px;
        cursor: pointer;
        transition: all 0.15s ease;
        text-align: left;
        color: var(--lab-text);
        font-family: inherit;
      }
      .preset:hover {
        border-color: var(--lab-accent);
        transform: translateY(-1px);
      }
      .preset.active {
        border-color: var(--lab-accent);
        box-shadow: 0 0 0 1px var(--lab-accent);
      }
      .preset-name {
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .preset-swatch {
        display: flex;
        gap: 3px;
        height: 14px;
        border-radius: 4px;
        overflow: hidden;
      }
      .preset-swatch > div {
        flex: 1;
      }

      /* color row */
      .color-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .color-row label {
        flex: 1;
        font-size: 12px;
        color: var(--lab-text-dim);
      }
      .color-row input[type="color"] {
        width: 36px;
        height: 28px;
        border: 1px solid var(--lab-border);
        border-radius: 6px;
        background: transparent;
        cursor: pointer;
        padding: 0;
      }
      .color-row input[type="text"] {
        width: 88px;
        background: var(--lab-panel-2);
        border: 1px solid var(--lab-border);
        border-radius: 6px;
        padding: 5px 8px;
        color: var(--lab-text);
        font-family: var(--font-mono);
        font-size: 11px;
      }

      /* selects */
      .select-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 10px;
      }
      .select-row label {
        font-size: 11px;
        color: var(--lab-text-dim);
      }
      .select-row select,
      .select-row input[type="text"] {
        background: var(--lab-panel-2);
        border: 1px solid var(--lab-border);
        border-radius: 6px;
        padding: 7px 10px;
        color: var(--lab-text);
        font-family: inherit;
        font-size: 12px;
      }

      /* slider */
      .slider-row {
        margin-bottom: 12px;
      }
      .slider-row .lbl {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--lab-text-dim);
        margin-bottom: 4px;
      }
      .slider-row input[type="range"] {
        width: 100%;
        accent-color: var(--lab-accent);
      }

      /* compare */
      .compare-toggle {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }
      .compare-toggle button {
        flex: 1;
        padding: 7px 8px;
        background: var(--lab-panel-2);
        border: 1px solid var(--lab-border);
        border-radius: 6px;
        color: var(--lab-text);
        font-family: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      .compare-toggle button.on {
        background: var(--lab-accent);
        color: var(--lab-bg);
        border-color: var(--lab-accent);
        font-weight: 700;
      }

      /* ====== Preview canvas ====== */
      .canvas {
        overflow-y: auto;
        padding: 0;
        background:
          radial-gradient(
            circle at 20% 10%,
            rgba(110, 231, 183, 0.04),
            transparent 40%
          ),
          radial-gradient(
            circle at 80% 90%,
            rgba(129, 140, 248, 0.04),
            transparent 40%
          ),
          var(--lab-bg);
      }
      .canvas-inner {
        padding: 28px 32px 80px;
        max-width: 920px;
        margin: 0 auto;
      }
      .canvas h2 {
        font-size: 12px;
        color: var(--lab-text-dim);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 700;
        margin: 28px 0 14px;
      }
      .canvas h2:first-child {
        margin-top: 0;
      }

      /* themed surface (preview area) */
      .preview-surface {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px;
        color: var(--text);
        font-family: var(--font-body);
        box-shadow: var(--shadow);
      }
      .preview-surface h3 {
        font-family: var(--font-heading);
        font-weight: 800;
        font-size: 24px;
        margin: 0 0 4px;
        color: var(--text);
        letter-spacing: -0.015em;
      }
      .preview-surface p.lead {
        color: var(--text-dim);
        margin: 0 0 22px;
        font-size: 14px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 18px;
      }

      /* --- themed components --- */
      .btn {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 14px;
        padding: 10px 18px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        border: 1px solid transparent;
        transition:
          transform 0.08s ease,
          filter 0.15s ease,
          box-shadow 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn:hover {
        filter: brightness(1.1);
      }
      .btn:active {
        transform: translateY(1px);
      }

      /* solid */
      .style-solid .btn-primary {
        background: var(--primary);
        color: var(--primary-contrast);
      }
      .style-solid .btn-secondary {
        background: var(--secondary);
        color: white;
      }
      .style-solid .btn-danger {
        background: var(--danger);
        color: white;
      }
      .style-solid .btn-ghost {
        background: transparent;
        color: var(--text);
        border-color: var(--border);
      }

      /* glass */
      .style-glass .btn-primary {
        background: rgba(255, 255, 255, 0.08);
        color: var(--primary);
        border: 1px solid rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
      }
      .style-glass .btn-secondary {
        background: rgba(255, 255, 255, 0.06);
        color: var(--secondary);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(12px);
      }
      .style-glass .btn-danger {
        background: rgba(248, 113, 113, 0.12);
        color: var(--danger);
        border: 1px solid rgba(248, 113, 113, 0.3);
        backdrop-filter: blur(12px);
      }
      .style-glass .btn-ghost {
        background: transparent;
        color: var(--text-dim);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      /* outline */
      .style-outline .btn-primary {
        background: transparent;
        color: var(--primary);
        border: 1.5px solid var(--primary);
      }
      .style-outline .btn-secondary {
        background: transparent;
        color: var(--secondary);
        border: 1.5px solid var(--secondary);
      }
      .style-outline .btn-danger {
        background: transparent;
        color: var(--danger);
        border: 1.5px solid var(--danger);
      }
      .style-outline .btn-ghost {
        background: transparent;
        color: var(--text);
        border: 1.5px solid var(--border);
      }

      /* neon */
      .style-neon .btn-primary {
        background: var(--primary);
        color: var(--primary-contrast);
        box-shadow:
          0 0 18px var(--primary),
          0 0 4px var(--primary);
      }
      .style-neon .btn-secondary {
        background: var(--secondary);
        color: white;
        box-shadow:
          0 0 18px var(--secondary),
          0 0 4px var(--secondary);
      }
      .style-neon .btn-danger {
        background: var(--danger);
        color: white;
        box-shadow: 0 0 18px var(--danger);
      }
      .style-neon .btn-ghost {
        background: transparent;
        color: var(--primary);
        border: 1px solid var(--primary);
        box-shadow: 0 0 8px var(--primary) inset;
      }

      /* brutal */
      .style-brutal .btn {
        border-radius: 0;
        border: 2px solid var(--text);
        box-shadow: 4px 4px 0 var(--text);
        font-weight: 700;
      }
      .style-brutal .btn-primary {
        background: var(--primary);
        color: var(--primary-contrast);
      }
      .style-brutal .btn-secondary {
        background: var(--secondary);
        color: white;
      }
      .style-brutal .btn-danger {
        background: var(--danger);
        color: white;
      }
      .style-brutal .btn-ghost {
        background: var(--bg);
        color: var(--text);
      }

      /* flat */
      .style-flat .btn {
        border-radius: 4px;
      }
      .style-flat .btn-primary {
        background: var(--primary);
        color: var(--primary-contrast);
      }
      .style-flat .btn-secondary {
        background: var(--secondary);
        color: white;
      }
      .style-flat .btn-danger {
        background: var(--danger);
        color: white;
      }
      .style-flat .btn-ghost {
        background: var(--surface-2);
        color: var(--text);
      }

      /* card */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        flex: 1;
        min-width: 200px;
      }
      .style-glass .card {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .style-neon .card {
        border: 1px solid var(--primary);
        box-shadow: 0 0 16px rgba(110, 231, 183, 0.15);
      }
      .style-brutal .card {
        border-radius: 0;
        border: 2px solid var(--text);
        box-shadow: 6px 6px 0 var(--text);
      }
      .card h4 {
        font-family: var(--font-heading);
        margin: 0 0 6px;
        font-size: 16px;
        color: var(--text);
      }
      .card p {
        color: var(--text-dim);
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
      }

      /* input */
      .input {
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 10px 14px;
        font-family: var(--font-body);
        font-size: 14px;
        width: 100%;
        outline: none;
      }
      .input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px
          color-mix(in srgb, var(--primary) 25%, transparent);
      }
      .style-brutal .input {
        border-radius: 0;
        border: 2px solid var(--text);
      }
      .style-flat .input {
        border-radius: 4px;
        background: transparent;
        border-bottom: 2px solid var(--border);
        border-top: none;
        border-left: none;
        border-right: none;
        padding-left: 0;
      }

      /* badge */
      .badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        font-family: var(--font-body);
      }
      .badge-primary {
        background: color-mix(in srgb, var(--primary) 20%, transparent);
        color: var(--primary);
      }
      .badge-success {
        background: color-mix(in srgb, var(--success) 20%, transparent);
        color: var(--success);
      }
      .badge-warning {
        background: color-mix(in srgb, var(--warning) 20%, transparent);
        color: var(--warning);
      }
      .badge-danger {
        background: color-mix(in srgb, var(--danger) 20%, transparent);
        color: var(--danger);
      }
      .style-brutal .badge {
        border-radius: 0;
        border: 1.5px solid currentColor;
      }

      /* toggle */
      .toggle {
        width: 44px;
        height: 24px;
        background: var(--border);
        border-radius: 999px;
        position: relative;
        cursor: pointer;
        transition: background 0.15s;
        flex-shrink: 0;
      }
      .toggle.on {
        background: var(--primary);
      }
      .toggle::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        background: white;
        border-radius: 50%;
        transition: left 0.15s;
      }
      .toggle.on::after {
        left: 22px;
      }
      .style-brutal .toggle {
        border-radius: 0;
        border: 2px solid var(--text);
      }
      .style-brutal .toggle::after {
        border-radius: 0;
      }

      /* nav sample */
      .nav {
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 12px 18px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      .nav .brand {
        font-family: var(--font-heading);
        font-weight: 800;
        font-size: 16px;
        color: var(--text);
      }
      .nav a {
        color: var(--text-dim);
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
      }
      .nav a.active {
        color: var(--primary);
      }
      .style-glass .nav {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .style-brutal .nav {
        border-radius: 0;
        border: 2px solid var(--text);
      }

      /* alert */
      .alert {
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        border-left: 3px solid var(--primary);
        background: color-mix(in srgb, var(--primary) 8%, var(--surface));
        color: var(--text);
        font-size: 13px;
      }
      .style-brutal .alert {
        border-radius: 0;
        border: 2px solid var(--text);
        border-left-width: 8px;
      }

      /* clickable hover */
      .clickable {
        position: relative;
        cursor: pointer;
      }
      .clickable::before {
        content: "클릭으로 복사";
        position: absolute;
        top: -10px;
        right: -10px;
        background: var(--lab-accent);
        color: var(--lab-bg);
        font-size: 10px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 4px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s;
        z-index: 10;
      }
      .clickable:hover::before {
        opacity: 1;
      }

      .component-block {
        margin-bottom: 18px;
        padding: 18px;
        border-radius: var(--radius);
        border: 1px dashed transparent;
        transition: border-color 0.15s;
      }
      .component-block:hover {
        border-color: var(--lab-accent);
      }
      .component-block .block-label {
        font-size: 10px;
        color: var(--lab-text-dim);
        margin-bottom: 10px;
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      /* compare grid (split view) */
      .compare-grid {
        display: grid;
        gap: 18px;
        grid-template-columns: 1fr;
      }
      .compare-grid.two {
        grid-template-columns: 1fr 1fr;
      }
      .compare-grid .compare-frame {
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid var(--lab-border);
      }
      .compare-frame .label {
        background: var(--lab-panel);
        padding: 6px 12px;
        font-size: 11px;
        color: var(--lab-text-dim);
        font-family: var(--font-mono);
        border-bottom: 1px solid var(--lab-border);
      }

      /* ====== Code panel (right) ====== */
      .codepane {
        background: var(--lab-panel);
        border-left: 1px solid var(--lab-border);
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      .codepane-head {
        padding: 16px 18px;
        border-bottom: 1px solid var(--lab-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .codepane-head h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
      }
      .copy-all-btn {
        background: var(--lab-accent);
        color: var(--lab-bg);
        border: none;
        padding: 7px 12px;
        border-radius: 6px;
        font-family: inherit;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
      }
      .copy-all-btn:hover {
        filter: brightness(1.1);
      }
      .codepane-body {
        flex: 1;
        overflow-y: auto;
        padding: 14px 18px 80px;
      }
      .code-section {
        margin-bottom: 18px;
      }
      .code-section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
      }
      .code-section-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--lab-text-dim);
        font-weight: 700;
      }
      .code-copy-btn {
        background: transparent;
        border: 1px solid var(--lab-border);
        color: var(--lab-text-dim);
        border-radius: 5px;
        padding: 3px 8px;
        font-size: 10px;
        cursor: pointer;
        font-family: var(--font-mono);
      }
      .code-copy-btn:hover {
        color: var(--lab-accent);
        border-color: var(--lab-accent);
      }
      pre {
        background: var(--lab-bg);
        border: 1px solid var(--lab-border);
        border-radius: 8px;
        padding: 12px;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        line-height: 1.55;
        color: #cdd5e0;
        overflow-x: auto;
        margin: 0;
        white-space: pre;
      }
      .tok-key {
        color: #6ee7b7;
      }
      .tok-val {
        color: #fbbf24;
      }
      .tok-tag {
        color: #818cf8;
      }
      .tok-attr {
        color: #f472b6;
      }
      .tok-str {
        color: #fcd34d;
      }
      .tok-com {
        color: #6b7280;
      }

      /* toast */
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: var(--lab-accent);
        color: var(--lab-bg);
        padding: 10px 18px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 13px;
        opacity: 0;
        transition: all 0.2s ease;
        z-index: 100;
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* font preview */
      .font-preview {
        padding: 8px 10px;
        background: var(--lab-panel-2);
        border-radius: 6px;
        font-size: 14px;
        margin-top: 4px;
        color: var(--lab-text);
      }

      /* scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #2a2f3a;
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3a414f;
      }

      @media (max-width: 1200px) {
        .app {
          grid-template-columns: 280px 1fr 340px;
        }
      }
      @media (max-width: 980px) {
        .app {

      const FONTS = [
        "Inter",
        "Noto Sans KR",
        "Plus Jakarta Sans",

        "Outfit",

      ];

      const COLOR_KEYS = [
        { key: "bg", label: "배경" },
        { key: "surface", label: "서피스" },
        { key: "surface-2", label: "서피스2" },
        { key: "border", label: "보더" },
        { key: "text", label: "텍스트" },
        { key: "text-dim", label: "텍스트 옅음" },
        { key: "primary", label: "프라이머리" },
        { key: "primary-contrast", label: "프라이머리 반전" },
        { key: "secondary", label: "세컨더리" },
        { key: "danger", label: "위험" },
        { key: "success", label: "성공" },
        { key: "warning", label: "경고" },
      ];

      /* ============================================================
   State
   ============================================================ */
      const INITIAL_PRESET = "{{DEFAULT_PRESET}}";
      const _initial =
        PRESETS.find((p) => p.id === INITIAL_PRESET) || PRESETS[0];
      let state = {
        preset: _initial.id,
        tokens: { ..._initial.tokens },
        compareMode: "single", // single | two
        themeB: PRESETS.find((p) => p.id !== _initial.id)?.id || "apple-clean",
      };

      /* ============================================================
   Init UI
   ============================================================ */
      function buildPresets() {
        const grid = document.getElementById("presetGrid");
        grid.innerHTML = PRESETS.map(
          (p) => `
    <button class="preset ${p.id === state.preset ? "active" : ""}" data-preset="${p.id}">
      <div class="preset-name">${p.name}</div>
      <div class="preset-swatch">
        <div style="background:${p.tokens.bg}"></div>
        <div style="background:${p.tokens.surface}"></div>
        <div style="background:${p.tokens.primary}"></div>
        <div style="background:${p.tokens.secondary}"></div>
        <div style="background:${p.tokens.text}"></div>
      </div>
    </button>
  `,
        ).join("");
        grid.querySelectorAll(".preset").forEach((btn) => {
          btn.addEventListener("click", () => applyPreset(btn.dataset.preset));
        });
      }

      function buildColorControls() {
        const wrap = document.getElementById("colorControls");
        wrap.innerHTML = COLOR_KEYS.map(
          (c) => `
    <div class="color-row">
      <label>${c.label}</label>
      <input type="text" data-color-text="${c.key}" />
      <input type="color" data-color-pick="${c.key}" />
    </div>
  `,
        ).join("");
        wrap.querySelectorAll("[data-color-pick]").forEach((inp) => {
          inp.addEventListener("input", (e) => {
            const k = e.target.dataset.colorPick;
            state.tokens[k] = e.target.value;
            wrap.querySelector(`[data-color-text="${k}"]`).value =
              e.target.value;
            render();
          });
        });
        wrap.querySelectorAll("[data-color-text]").forEach((inp) => {
          inp.addEventListener("change", (e) => {
            const k = e.target.dataset.colorText;
            state.tokens[k] = e.target.value;
            wrap.querySelector(`[data-color-pick="${k}"]`).value =
              e.target.value;
            render();
          });
        });
      }

      function buildFontSelects() {
        const fh = document.getElementById("fontHeading");
        const fb = document.getElementById("fontBody");
        fh.innerHTML = FONTS.map(
          (f) => `<option value="${f}">${f}</option>`,
        ).join("");
        fb.innerHTML = FONTS.map(
          (f) => `<option value="${f}">${f}</option>`,
        ).join("");
        fh.addEventListener("change", (e) => {
          state.tokens["font-heading"] = e.target.value;
          render();
        });
        fb.addEventListener("change", (e) => {
          state.tokens["font-body"] = e.target.value;
          render();
        });
      }

      function buildThemeBSelect() {
        const sel = document.getElementById("themeB");
        sel.innerHTML = PRESETS.map(
          (p) => `<option value="${p.id}">${p.name}</option>`,
        ).join("");
        sel.value = state.themeB;
        sel.addEventListener("change", (e) => {
          state.themeB = e.target.value;
          render();
        });
      }

      function bindControls() {
        document.querySelectorAll(".compare-toggle button").forEach((btn) => {
          btn.addEventListener("click", () => {
            document
              .querySelectorAll(".compare-toggle button")
              .forEach((b) => b.classList.remove("on"));
            btn.classList.add("on");
            state.compareMode = btn.dataset.compare;
            document.getElementById("themeBRow").style.display =
              state.compareMode === "two" ? "flex" : "none";
            render();
          });
        });

        const radius = document.getElementById("radius");
        radius.addEventListener("input", (e) => {
          state.tokens.radius = e.target.value;
          document.getElementById("radiusVal").textContent =
            e.target.value + "px";
          render();
        });

        const bs = document.getElementById("buttonStyle");
        bs.addEventListener("change", (e) => {
          state.tokens["button-style"] = e.target.value;
          render();
        });

        document.getElementById("copyAll").addEventListener("click", () => {
          const css = buildCSSVars(state.tokens);
          const html = buildAllComponentsHTML(state.tokens);
          copyToClipboard(
            `/* === CSS variables === */\n${css}\n\n<!-- === HTML === -->\n${html}`,
          );
        });
      }

      /* ============================================================
   Apply preset / sync UI
   ============================================================ */
      function applyPreset(id) {
        const p = PRESETS.find((x) => x.id === id);
        if (!p) return;
        state.preset = id;
        state.tokens = { ...p.tokens };
        syncUI();
        render();
      }

      function syncUI() {
        document
          .querySelectorAll(".preset")
          .forEach((b) =>
            b.classList.toggle("active", b.dataset.preset === state.preset),
          );
        COLOR_KEYS.forEach((c) => {
          const v = state.tokens[c.key];
          const txt = document.querySelector(`[data-color-text="${c.key}"]`);
          const pick = document.querySelector(`[data-color-pick="${c.key}"]`);
          if (txt) txt.value = v;
          if (pick) pick.value = v;
        });
        document.getElementById("fontHeading").value =
          state.tokens["font-heading"];
        document.getElementById("fontBody").value = state.tokens["font-body"];
        document.getElementById("radius").value = state.tokens.radius;
        document.getElementById("radiusVal").textContent =
          state.tokens.radius + "px";
        document.getElementById("buttonStyle").value =
          state.tokens["button-style"];
        document.getElementById("fontHeadingPreview").style.fontFamily =
          `'${state.tokens["font-heading"]}', sans-serif`;
        document.getElementById("fontBodyPreview").style.fontFamily =
          `'${state.tokens["font-body"]}', sans-serif`;
      }

      /* ============================================================
   Render preview
   ============================================================ */
      function styleTagFromTokens(tokens, scope) {
        const radius = tokens.radius;
        const radiusSm = Math.max(0, parseInt(radius) - 4);
        const lines = [];
        for (const [k, v] of Object.entries(tokens)) {
          if (k === "radius") {
            lines.push(`--radius: ${v}px;`);
            lines.push(`--radius-sm: ${radiusSm}px;`);
          } else if (k === "font-heading" || k === "font-body") {
            lines.push(`--${k}: '${v}', sans-serif;`);
          } else if (k === "button-style") {
            // skip; class
          } else {
            lines.push(`--${k}: ${v};`);
          }
        }
        return `<style>${scope} { ${lines.join(" ")} }</style>`;
      }

      function componentsHTML() {

      <div class="row" style="align-items:center; gap:14px;">
        <div class="toggle on" onclick="this.classList.toggle('on')"></div>
        <span style="color:var(--text-dim); font-size:13px;">알림을 활성화</span>
      </div>
    </div>

    <div class="component-block clickable" data-copy-key="alert">
      <div class="block-label">// Alert</div>
      <div class="alert">이것은 알림 메시지 샘플입니다.</div>
    </div>
  `;

      function buildSurface(tokens, label) {
        const buttonClass = `style-${tokens["button-style"]}`;
        const scope = `.surface-${label}`;
        return `
    ${styleTagFromTokens(tokens, scope)}
    <div class="compare-frame">
      ${label ? `<div class="label">${label}</div>` : ""}
      <div class="${buttonClass} surface-${label}">
        <div class="preview-surface">
          ${componentsHTML()}
        </div>
      </div>
    </div>
  `;
      }

      function render() {
        const area = document.getElementById("previewArea");
        if (state.compareMode === "single") {
          area.innerHTML = `<div class="compare-grid">${buildSurface(state.tokens, "A")}</div>`;
        } else {
          const presetB = PRESETS.find((p) => p.id === state.themeB);
          area.innerHTML = `
      <div class="compare-grid two">
        ${buildSurface(state.tokens, "A")}
        ${buildSurface(presetB.tokens, "B")}
      </div>
    `;
        }
        bindClickCopy();
        renderCodePane();
      }

      /* ============================================================
   Code generation
   ============================================================ */
      function buildCSSVars(tokens) {
        const radius = tokens.radius;
        const radiusSm = Math.max(0, parseInt(radius) - 4);
        const lines = [];
        lines.push(":root {");
        for (const [k, v] of Object.entries(tokens)) {
          if (k === "radius") {
            lines.push(`  --radius: ${v}px;`);
            lines.push(`  --radius-sm: ${radiusSm}px;`);
          } else if (k === "font-heading" || k === "font-body") {
            lines.push(`  --${k}: '${v}', sans-serif;`);
          } else if (k === "button-style") {
            lines.push(`  /* button-style: ${v} */`);
          } else {
            lines.push(`  --${k}: ${v};`);
          }
        }
        lines.push("}");
        return lines.join("\n");
      }

        hero: () => `<section class="hero">
  <h3>독창적인 UI를 가장 빠르게.</h3>
  <p class="lead">테마를 전환하고, 컴포넌트를 클릭해 코드를 복사하세요.</p>
  <button class="btn btn-primary">시작하기</button>
  <button class="btn btn-ghost">문서</button>
</section>

<style>
.hero h3 { font-family:var(--font-heading); font-weight:800; font-size:24px;
  color:var(--text); margin:0 0 4px; letter-spacing:-0.015em; }
.hero .lead { color:var(--text-dim); margin:0 0 22px; font-size:14px; }
</style>`,

        buttons: (style) => buttonCSS(style),

        badges: () => `<span class="badge badge-primary">프라이머리</span>
<span class="badge badge-success">성공</span>
<span class="badge badge-warning">경고</span>
<span class="badge badge-danger">위험</span>

<style>
.badge { display:inline-block; padding:3px 10px; border-radius:999px;
  font-size:11px; font-weight:600; font-family:var(--font-body); }
.badge-primary { background:color-mix(in srgb,var(--primary) 20%,transparent); color:var(--primary); }
.badge-success { background:color-mix(in srgb,var(--success) 20%,transparent); color:var(--success); }
.badge-warning { background:color-mix(in srgb,var(--warning) 20%,transparent); color:var(--warning); }
.badge-danger  { background:color-mix(in srgb,var(--danger) 20%,transparent);  color:var(--danger); }
</style>`,

        cards: () => `<div class="card">
  <h4>Card title</h4>
  <p>테마 토큰에 따라 자동으로 색·형상이 변하는 카드.</p>
</div>

<style>
.card { background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:18px; }
.card h4 { font-family:var(--font-heading); margin:0 0 6px; font-size:16px; color:var(--text); }
.card p { color:var(--text-dim); margin:0; font-size:13px; line-height:1.5; }
</style>`,

        input: () => `<input class="input" placeholder="메시지를 입력..." />

<style>
.input { background:var(--surface-2); color:var(--text); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:10px 14px;
  font-family:var(--font-body); font-size:14px; width:100%; outline:none; }
.input:focus { border-color:var(--primary);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 25%,transparent); }
</style>`,

        toggle:
          () => `<div class="toggle" onclick="this.classList.toggle('on')"></div>

<style>
.toggle { width:44px; height:24px; background:var(--border); border-radius:999px;
  position:relative; cursor:pointer; transition:background .15s; }
.toggle.on { background:var(--primary); }
.toggle::after { content:''; position:absolute; top:2px; left:2px;
  width:20px; height:20px; background:#fff; border-radius:50%; transition:left .15s; }
.toggle.on::after { left:22px; }
</style>`,

        alert:
          () => `<div class="alert">이것은 알림 메시지 샘플입니다.</div>

<style>
.alert { padding:12px 16px; border-radius:var(--radius-sm);
  border-left:3px solid var(--primary);
  background:color-mix(in srgb,var(--primary) 8%,var(--surface));
  color:var(--text); font-size:13px; }
</style>`,
      };

      function buttonCSS(style) {
        const base = `<button class="btn btn-primary">Primary</button>
<button class="btn btn-secondary">Secondary</button>
<button class="btn btn-danger">Danger</button>
<button class="btn btn-ghost">Ghost</button>

<style>
.btn { font-family:var(--font-body); font-weight:600; font-size:14px;
  padding:10px 18px; border-radius:var(--radius-sm); cursor:pointer;
  border:1px solid transparent;
  transition:transform .08s, filter .15s, box-shadow .15s;
  display:inline-flex; align-items:center; gap:6px; }
.btn:hover { filter:brightness(1.1); }
.btn:active { transform:translateY(1px); }
`;
        const variants = {
          solid: `.btn-primary   { background:var(--primary);   color:var(--primary-contrast); }
.btn-secondary { background:var(--secondary); color:#fff; }
.btn-danger    { background:var(--danger);    color:#fff; }
.btn-ghost     { background:transparent; color:var(--text); border-color:var(--border); }`,
          glass: `.btn-primary   { background:rgba(255,255,255,.08); color:var(--primary);
                  border:1px solid rgba(255,255,255,.15); backdrop-filter:blur(12px); }
.btn-secondary { background:rgba(255,255,255,.06); color:var(--secondary);
                  border:1px solid rgba(255,255,255,.12); backdrop-filter:blur(12px); }
.btn-danger    { background:rgba(248,113,113,.12); color:var(--danger);
                  border:1px solid rgba(248,113,113,.3); backdrop-filter:blur(12px); }
.btn-ghost     { background:transparent; color:var(--text-dim);
                  border:1px solid rgba(255,255,255,.08); }`,
          outline: `.btn-primary   { background:transparent; color:var(--primary);   border:1.5px solid var(--primary); }
.btn-secondary { background:transparent; color:var(--secondary); border:1.5px solid var(--secondary); }
.btn-danger    { background:transparent; color:var(--danger);    border:1.5px solid var(--danger); }
.btn-ghost     { background:transparent; color:var(--text);      border:1.5px solid var(--border); }`,
          neon: `.btn-primary   { background:var(--primary); color:var(--primary-contrast);
                  box-shadow:0 0 18px var(--primary), 0 0 4px var(--primary); }
.btn-secondary { background:var(--secondary); color:#fff;
                  box-shadow:0 0 18px var(--secondary); }
.btn-danger    { background:var(--danger); color:#fff;
                  box-shadow:0 0 18px var(--danger); }
.btn-ghost     { background:transparent; color:var(--primary);
                  border:1px solid var(--primary);
                  box-shadow:0 0 8px var(--primary) inset; }`,
          brutal: `.btn { border-radius:0; border:2px solid var(--text);
       box-shadow:4px 4px 0 var(--text); font-weight:700; }
.btn-primary   { background:var(--primary);   color:var(--primary-contrast); }
.btn-secondary { background:var(--secondary); color:#fff; }
.btn-danger    { background:var(--danger);    color:#fff; }
.btn-ghost     { background:var(--bg); color:var(--text); }`,
          flat: `.btn { border-radius:4px; }
.btn-primary   { background:var(--primary);   color:var(--primary-contrast); }
.btn-secondary { background:var(--secondary); color:#fff; }
.btn-danger    { background:var(--danger);    color:#fff; }
.btn-ghost     { background:var(--surface-2); color:var(--text); }`,
        };
        return base + (variants[style] || variants.solid) + "\n</style>";
      }

      function buildAllComponentsHTML(tokens) {
        const buttonStyle = tokens["button-style"];
        return Object.keys(COMPONENT_SNIPPETS)
          .map((k) => {
            const snip =
              k === "buttons"
                ? COMPONENT_SNIPPETS[k](buttonStyle)
                : COMPONENT_SNIPPETS[k]();
            return `<!-- ${k} -->\n${snip}`;
          })
          .join("\n\n");
      }

      function esc(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function highlightCSS(s) {
        return esc(s)
          .replace(/(\/\*[^*]*\*\/)/g, '<span class="tok-com">$1</span>')
          .replace(/(--[a-z-0-9]+)(\s*:)/g, '<span class="tok-key">$1</span>$2')
          .replace(/(:\s*)([^;]+)(;)/g, '$1<span class="tok-val">$2</span>$3');
      }

      function highlightHTML(s) {
        return esc(s)
          .replace(
            /(&lt;\/?)([a-zA-Z][\w-]*)/g,
            '$1<span class="tok-tag">$2</span>',
          )
          .replace(
            /([a-zA-Z-]+)(=)(&quot;[^&]*&quot;)/g,
            '<span class="tok-attr">$1</span>$2<span class="tok-str">$3</span>',
          );
      }

      function renderCodePane() {
        const css = buildCSSVars(state.tokens);
        const buttonStyle = state.tokens["button-style"];
        const pane = document.getElementById("codePaneBody");

        const sections = [];

        sections.push({
          id: "css-vars",
          title: ":root CSS variables",
          code: css,
          highlight: highlightCSS,
        });

        Object.keys(COMPONENT_SNIPPETS).forEach((k) => {
          const snip =
            k === "buttons"
              ? COMPONENT_SNIPPETS[k](buttonStyle)
              : COMPONENT_SNIPPETS[k]();
          sections.push({
            id: k,
            title: k,
            code: snip,
            highlight: highlightHTML,
          });
        });

        pane.innerHTML = sections
          .map(
            (s) => `
    <div class="code-section">
      <div class="code-section-head">
        <div class="code-section-title">${s.title}</div>
        <button class="code-copy-btn" data-copy-section="${s.id}">copy</button>
      </div>
      <pre data-raw="${esc(s.code).replace(/"/g, "&quot;")}">${s.highlight(s.code)}</pre>
    </div>
  `,
          )
          .join("");

        pane.querySelectorAll("[data-copy-section]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const pre = btn.closest(".code-section").querySelector("pre");
            const raw = pre
              .getAttribute("data-raw")
              .replace(/&quot;/g, '"')
              .replace(/&lt;/g, "<")
              .replace(/&gt;/g, ">")
              .replace(/&amp;/g, "&");
            copyToClipboard(raw);
          });
        });
      }

      /* ============================================================
   Click-to-copy on preview
   ============================================================ */
      function bindClickCopy() {
        document.querySelectorAll("[data-copy-key]").forEach((el) => {
          el.addEventListener("click", (e) => {
            const key = el.dataset.copyKey;
            const buttonStyle = state.tokens["button-style"];
            const snip =
              key === "buttons"
                ? COMPONENT_SNIPPETS[key](buttonStyle)
                : COMPONENT_SNIPPETS[key]();
            const css = buildCSSVars(state.tokens);
            copyToClipboard(
              `/* === root variables === */\n${css}\n\n<!-- === ${key} === -->\n${snip}`,
            );
          });
        });
      }

      /* ============================================================
   Clipboard + toast
   ============================================================ */
      function copyToClipboard(text) {
        navigator.clipboard
          .writeText(text)
          .then(() => showToast("복사했습니다"));
      }
      function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove("show"), 1400);
      }

      /* ============================================================
   Boot
   ============================================================ */
      buildPresets();
      buildColorControls();
      buildFontSelects();
      buildThemeBSelect();
      bindControls();
      syncUI();
      render();
    </script>
  </body>
</html>
